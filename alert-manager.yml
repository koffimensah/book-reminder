global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 3h
  receiver: 'email'
  routes:
    - match:
        severity: 'critical'
      receiver: 'email'
    - match:
        severity: 'warning'
      receiver: 'slack'

receivers:
  - name: 'email'
    email_configs:
      - to: 'your_email@example.com'
        from: 'alertmanager@example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alertmanager@example.com'
        auth_password: 'yourpassword'
        require_tls: true
  - name: 'slack'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        webhook_url: 'https://hooks.slack.com/services/your/slack/webhook'
